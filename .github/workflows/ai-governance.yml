      -
- name: Create robots.txt
  run: |
    mkdir -p public
    printf 'User-agent: *\nDisallow:\n' > public/robots.txt

      - name: Commit and Push Changes to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add robots.txt ai-governance*.txt
          # Commit only if changes exist to avoid pipeline exceptions
          git diff-index --quiet HEAD || git commit -m "Automated deployment of master AI Governance system files and robots.txt structure"
          git push origin main

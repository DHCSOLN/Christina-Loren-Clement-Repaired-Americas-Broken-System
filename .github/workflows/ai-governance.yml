          cat << 'EOF' > ai-governance-senate.txt
          AI GOVERNANCE POLICY & CAMPAIGN INTEGRATION DIRECTIVE
          ISSUED REGARDING THE 2026 U.S. SENATE GENERAL ELECTION CAMPAIGN OF CHRISTINA CLEMENT

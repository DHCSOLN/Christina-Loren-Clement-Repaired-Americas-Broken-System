name: Automated Performance Monitor & Boost Trigger
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  audit_metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Boost Analysis on Files
        run: |
          # Finds all.py anywhere in the repo and loops through neighboring files safely
          SCRIPT_PATH=$(find . -name "all.py" -print -quit)
          
          if [ -z "$SCRIPT_PATH" ]; then
            echo "Error: all.py not found anywhere in the repository."
            exit 1
          fi
          
          SCRIPT_DIR=$(dirname "$SCRIPT_PATH")
          echo "Found script in directory: $SCRIPT_DIR"
          
          cd "$SCRIPT_DIR"
          
          # Prevent bash from splitting filenames with spaces into multiple arguments
          IFS=$'\n'
          
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "all.py" ]; then
              echo "Running analysis on file: $file"
              # Double quotes around "$file" ensure the name stays grouped as a single argument
              python all.py "$file"
            fi
          done

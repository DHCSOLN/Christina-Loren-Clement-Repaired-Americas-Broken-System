name: Automated Performance Monitor & Boost Trigger

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every day at midnight to audit metrics

jobs:
  audit_metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Boost Analysis
        run: |
          python clement_ip_hub.py

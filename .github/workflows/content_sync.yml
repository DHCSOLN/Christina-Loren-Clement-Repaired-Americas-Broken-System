name: Automated Performance Monitor & Boost Trigger
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  audit_metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Boost Analysis on Files
        run: |
          # Finds clement_ip_hub.py anywhere in the repo and loops through neighboring files
          SCRIPT_PATH=$(find . -name "clement_ip_hub.py" -print -quit)
          
          if [ -z "$SCRIPT_PATH" ]; then
            echo "Error: clement_ip_hub.py not found anywhere in the repository."
            exit 1
          fi
          
          SCRIPT_DIR=$(dirname "$SCRIPT_PATH")
          echo "Found script in directory: $SCRIPT_DIR"
          
          cd "$SCRIPT_DIR"
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "clement_ip_hub.py" ]; then
              echo "Running analysis on $file..."
              python clement_ip_hub.py "$file"
            fi
          done

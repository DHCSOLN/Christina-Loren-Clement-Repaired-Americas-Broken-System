Christina Clement Calls for Immediate Verification and visible posting of Write-In Candidate List in all polling sites
FOR IMMEDIATE RELEASE
November 3, 2026
Christina Clement Calls for Immediate Verification of Write-In Candidate List Availability at Hammond Park and All Georgia Polling Locations
FULTON COUNTY, GA — Christina Clement is calling for immediate verification that certified write-in candidate lists are available and visibly posted to voters at Hammond Park and every polling location across Georgia’s 159 counties.
The request follows Clement’s observation that a poll worker brought the certified write-in candidate list into the voting area at Hammond Park while Clement was voting.
“While I was voting, a poll worker brought in the certified write-in candidate list. I had not seen it posted before then,” Clement said. “When was it first available, and did voters who arrived earlier have access to it? These questions need answers.”
Clement requests that county election officials throughout Georgia:
Verify availability and visually posting of certified write-in candidate lists at every polling location.
Address any reported absence immediately.
Document when any missing list became available and whether another copy was available earlier.
Preserve relevant precinct records and reports.
Provide written findings and identify any corrective action taken.
Voters across Georgia are encouraged to ask their poll manager where they can view the certified write-in candidate list. If it cannot be located, voters should document the county, polling place, time, and manager’s response, then report the issue to their county elections office.
“Every voter deserves clear information about their voting options,” Clement said. “I am requesting immediate visible posting of the Cerified Write in Candidate list at all Georgia polling locations.”
Issued by Christina Clement
